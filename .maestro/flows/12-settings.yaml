# 전제: 아무 탭(키보드 닫힘)
# 남김: 홈, 다음 출발 07:45 월·수(30분 전 알림)
appId: com.yuncastlee.chaengkim
name: "12 설정"
---
- waitForAnimationToEnd
# 이전 실행에서 남은 알림 창이 있으면 닫는다.
- tapOn:
    text: "OK"
    optional: true
- runFlow:
    file: ../subflows/tap-tab.yaml
    env:
      TAB: "설정, tab.*"
- assertVisible: "출발 알림"
# 출발 시각 입력칸(현재 값 HH:MM)의 오른쪽 끝을 눌러 커서를 맨 뒤에 두고 새 시각을 넣는다.
- tapOn:
    text: "[0-9]{2}:[0-9]{2}"
    point: "95%,50%"
- eraseText: 5
- inputText: "0745"
# 키보드의 완료 키로 닫는다(이때 시각이 저장된다).
- pressKey: Enter
# 요일 버튼은 누를 때마다 켜고 끄므로, 꺼져 있을 때만 눌러 몇 번을 돌려도 월·수가 켜져 있게 한다.
- tapOn:
    text: "월"
    selected: false
    optional: true
- tapOn:
    text: "수"
    selected: false
    optional: true
# lint: no-result — 선택 칩은 문구가 바뀌지 않는다(알림 시각은 홈 타일에 나오지 않는다).
- tapOn: "30분"
- takeScreenshot: 12-settings
- waitForAnimationToEnd
- runFlow:
    file: ../subflows/tap-tab.yaml
    env:
      TAB: "홈, tab.*"
# 홈이 어디까지 스크롤돼 있든 같은 결과가 나오게 맨 위로 올린 뒤 타일까지 내린다.
- scrollUntilVisible:
    element: "지금 출발.*"
    direction: UP
- scrollUntilVisible:
    element: "다음 출발.*"
    direction: DOWN
    visibilityPercentage: 50
- assertVisible: "(?s).*07:45.*"
- takeScreenshot: 12-home-schedule
