# 전제: 소지품 지갑·열쇠·에어팟, 외출 전
# 남김: 홈 외출 중(열쇠·에어팟을 챙김)
appId: com.yuncastlee.chaengkim
name: "5 출발 체크"
---
- waitForAnimationToEnd
- runFlow:
    file: ../subflows/tap-tab.yaml
    env:
      TAB: "홈, tab.*"
- runFlow:
    file: ../subflows/tap-until.yaml
    env:
      TAP: "지금 출발.*"
      UNTIL: "(?s).*골라 주세요.*"
# 온보딩에서 담은 물건 중 지갑을 빼고 출발한다.
- runFlow:
    file: ../subflows/tap-until.yaml
    env:
      TAP: "지갑"
      UNTIL: "2개 챙기고 외출 시작"
- takeScreenshot: 05-departure-checked
# 체크 직후 버튼 문구가 다시 그려지는 중의 탭은 무시될 수 있다.
- runFlow:
    file: ../subflows/tap-until.yaml
    env:
      TAP: ".*챙기고 외출 시작"
      UNTIL: "외출 중"
- assertVisible: "(?s).*외출 중이에요.*"
- assertVisible: "소지품 확인"
- assertVisible: "집에 도착했어요"
- takeScreenshot: 05-home-outing
