# 전제: 홈 외출 중, 챙긴 물건에 열쇠 포함
# 남김: 홈 외출 전, 연속 챙김 0번(열쇠를 빠뜨림)
appId: com.yuncastlee.chaengkim
name: "8 귀가 (빠뜨림)"
---
- waitForAnimationToEnd
- runFlow:
    file: ../subflows/tap-tab.yaml
    env:
      TAB: "홈, tab.*"
- runFlow:
    file: ../subflows/tap-until.yaml
    env:
      TAP: "집에 도착했어요"
      UNTIL: "(?s).*모두 함께 왔나요.*"
- runFlow:
    file: ../subflows/tap-until.yaml
    env:
      TAP: "모두 있어요"
      UNTIL: "모두 확인하고 마치기"
# 열쇠만 빼서 빠뜨린 상태로 만든다.
- runFlow:
    file: ../subflows/tap-until.yaml
    env:
      TAP: "열쇠"
      UNTIL: "확인한 물건으로 마치기"
- runFlow:
    file: ../subflows/tap-until.yaml
    env:
      TAP: "확인한 물건으로 마치기"
      UNTIL: "(?s).*아직 확인되지 않았어요.*"
- takeScreenshot: 08-confirm-dialog
- runFlow:
    file: ../subflows/tap-until.yaml
    env:
      TAP: "마치기"
      UNTIL: "(?s).*보이지 않나요.*"
- takeScreenshot: 08-result-missing
- runFlow:
    file: ../subflows/tap-until.yaml
    env:
      TAP: "홈으로"
      UNTIL: "다챙김"
- scrollUntilVisible:
    element: "연속 챙김.*"
    direction: DOWN
- assertVisible: "(?s).*0번.*"
- scrollUntilVisible:
    element: "지금 출발.*"
    direction: UP
