appId: com.yuncastlee.chaengkim
name: "1 온보딩"
---
- assertVisible: "(?s).*잊기 쉬운 순간에.*"
# 위치 권한 창(사용 중 → 항상 허용 변경 안내)이 뜨는 대로 허용하며 다음 화면까지 간다.
- runFlow:
    file: ../subflows/tap-until.yaml
    env:
      TAP: "계속"
      UNTIL: "(?s).*돌아올 곳을.*"
      PROMPT: "앱을 사용하는 동안 허용|'항상 허용'으로 변경|항상 허용으로 변경|OK|확인"
- takeScreenshot: 01-home-register
- tapOn: "현재 위치를 집으로 등록"
- extendedWaitUntil:
    visible: "다음"
    timeout: 20000
- tapOn: "다음"
- assertVisible: "늘 챙기는 물건부터"
- takeScreenshot: 01-default-items
- tapOn: "챙김 시작하기"
- extendedWaitUntil:
    visible: "(?s).*담았어요.*"
    timeout: 15000
