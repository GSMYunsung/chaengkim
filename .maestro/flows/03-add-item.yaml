# 전제: 홈(외출 전), 소지품 지갑·열쇠·에어팟
# 남김: 홈, 소지품에 우산 추가(4개)
appId: com.yuncastlee.chaengkim
name: "3 소지품 추가"
---
- waitForAnimationToEnd
- runFlow:
    file: ../subflows/tap-tab.yaml
    env:
      TAB: "소지품, tab.*"
- runFlow:
    file: ../subflows/tap-until.yaml
    env:
      TAP: "추가"
      UNTIL: "예: 우산"
- tapOn: "예: 우산"
- inputText: "우산"
# 저장하면 소지품 목록으로 돌아간다.
- runFlow:
    file: ../subflows/tap-until.yaml
    env:
      TAP: "저장"
      UNTIL: "(?s).*챙기고 있어요.*"
- assertVisible: "(?s).*우산.*"
- takeScreenshot: 03-items-with-umbrella
- runFlow:
    file: ../subflows/tap-tab.yaml
    env:
      TAB: "홈, tab.*"
- waitForAnimationToEnd
- assertVisible: "우산"
- takeScreenshot: 03-home-with-umbrella
