# TAP을 UNTIL이 보일 때까지 누른다. 화면 전환 중(시스템 창이 닫힌 직후, 저장 후 닫히는 중)의 탭은
# 무시되는데 Maestro는 화면이 바뀐 것으로 보고 다시 누르지 않기 때문이다.
# PROMPT(선택): 그 동작이 띄우는 창의 버튼(권한 창 등)을 정규식으로. 뜨는 대로 누른다.
#   - runFlow:
#       file: ../subflows/tap-until.yaml
#       env:
#         TAP: "계속"
#         UNTIL: "(?s).*다음 화면 문구.*"
#         PROMPT: "앱을 사용하는 동안 허용"
appId: ${APP_ID}
env:
  PROMPT: "__no_prompt__"
---
- tapOn: ${TAP}
- repeat:
    while:
      notVisible: ${UNTIL}
    times: 10
    commands:
      - tapOn:
          text: ${PROMPT}
          optional: true
      - tapOn:
          text: ${TAP}
          optional: true
      - waitForAnimationToEnd
- assertVisible: ${UNTIL}
